name: Validate development environment

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test-suite.yml

  compose-dev:
    name: Development Compose smoke test
    needs: tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Configure local CI environment
        run: |
          cp backend/.env.ci backend/.env.local
          cp frontend/.env.example frontend/.env.local

      - name: Build and start all development services
        run: docker compose --env-file backend/.env.local -f docker-compose.dev.yml --profile all up --build --detach

      - name: Verify frontend, backend and PostGIS
        run: |
          curl --fail --show-error --retry 30 --retry-delay 2 --retry-connrefused http://localhost:4321/
          curl --fail --show-error --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/actuator/health
          docker compose --env-file backend/.env.local -f docker-compose.dev.yml --profile all exec --no-TTY db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT postgis_version();"' | grep -q '^3\.'

      - name: Show service logs after failure
        if: failure()
        run: docker compose --env-file backend/.env.local -f docker-compose.dev.yml --profile all logs --no-color

      - name: Stop development services
        if: always()
        run: docker compose --env-file backend/.env.local -f docker-compose.dev.yml --profile all down --volumes --remove-orphans
