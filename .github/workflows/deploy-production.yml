name: Production build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  tests:
    uses: ./.github/workflows/test-suite.yml

  compose-production:
    name: Production Compose smoke test
    needs: tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated production environment
        run: |
          cp .env.production.example .env.production
          sed -i 's|^DOMAIN=.*|DOMAIN=localhost|' .env.production

      - name: Build and start production services
        run: docker compose --env-file .env.production -f docker-compose.prod.yml up --build --detach

      - name: Verify backend health and PostGIS
        run: |
          for attempt in $(seq 1 60); do
            if curl --insecure --fail --silent https://localhost/actuator/health >/dev/null; then
              echo "Backend healthy after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Backend did not become healthy in time"
              exit 1
            fi
            sleep 2
          done
          docker compose --env-file .env.production -f docker-compose.prod.yml exec --no-TTY db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT postgis_version();"' | grep -q '^3\.'

      - name: Show service logs after failure
        if: failure()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color

      - name: Stop production services
        if: always()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml down --volumes --remove-orphans

  deploy-oracle:
    name: Deploy backend and database to Oracle
    needs: compose-production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment archive
        run: tar -czf deploy.tar.gz backend database docker-compose.prod.yml Caddyfile

      - name: Prepare production environment file
        run: |
          cat > .env.production <<'EOF'
          DOMAIN=${{ secrets.DOMAIN }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
          EOF

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          passphrase: ${{ secrets.ORACLE_SSH_PASSPHRASE }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          source: deploy.tar.gz,.env.production
          target: /home/${{ secrets.ORACLE_SSH_USER }}

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_SSH_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          passphrase: ${{ secrets.ORACLE_SSH_PASSPHRASE }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          script: |
            set -e
            mkdir -p /home/${{ secrets.ORACLE_SSH_USER }}/mapaGasolineras
            mv /home/${{ secrets.ORACLE_SSH_USER }}/deploy.tar.gz /home/${{ secrets.ORACLE_SSH_USER }}/mapaGasolineras/
            mv /home/${{ secrets.ORACLE_SSH_USER }}/.env.production /home/${{ secrets.ORACLE_SSH_USER }}/mapaGasolineras/
            cd /home/${{ secrets.ORACLE_SSH_USER }}/mapaGasolineras
            sudo rm -rf backend database docker-compose.prod.yml Caddyfile
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            docker compose --env-file .env.production -f docker-compose.prod.yml down --remove-orphans || true
            docker compose --env-file .env.production -f docker-compose.prod.yml up --build --detach
            docker image prune --filter dangling=true --force

  deploy-cloudflare:
    name: Deploy frontend to Cloudflare Pages
    needs: compose-production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static site
        working-directory: frontend
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_MAP_LIBRARY: ${{ vars.PUBLIC_MAP_LIBRARY || 'leaflet' }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
