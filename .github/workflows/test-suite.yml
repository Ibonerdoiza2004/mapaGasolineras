name: Test suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build static site
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    env:
      SERVER_PORT: 8080
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: gasolineras_ci
      POSTGRES_USER: gasolineras_ci
      POSTGRES_PASSWORD: ci-only-not-a-secret

    services:
      postgres:
        image: postgis/postgis:15-3.5
        env:
          POSTGRES_DB: gasolineras_ci
          POSTGRES_USER: gasolineras_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gasolineras_ci -d gasolineras_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/5432) 2>/dev/null; then
              echo "PostgreSQL listo (intento $attempt)"
              exit 0
            fi
            echo "Esperando a PostgreSQL... ($attempt/30)"
            sleep 2
          done
          echo "PostgreSQL no quedó disponible"
          exit 1

      - name: Run tests
        working-directory: backend
        run: ./mvnw --batch-mode verify
