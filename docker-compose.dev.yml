
name: mapa-gasolineras-dev

services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    profiles: ["db", "backend", "all"]
    env_file:
      - ./backend/.env.local
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    profiles: ["backend", "all"]
    env_file:
      - ./backend/.env.local
    environment:
      # Dentro de la red Docker PostgreSQL siempre escucha en 5432.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    volumes:
      - ./backend:/workspace
      - backend-maven-cache:/root/.m2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    profiles: ["frontend", "all"]
    env_file:
      - ./frontend/.env.local
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # CI usa localhost; frontend/.env.local lo sobrescribe para la red LAN.
      PUBLIC_API_URL: "${PUBLIC_API_URL:-http://localhost:8080}"
    depends_on:
      map-server:
        condition: service_healthy
    ports:
      - "4321:4321"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

  map-server:
    image: caddy:2.8-alpine
    profiles: ["frontend", "all", "map"]
    ports:
      - "8081:8080"
    volumes:
      - ./map-tiles/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./map-tiles/data/publish:/srv/maps:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s

volumes:
  postgres-data:
  backend-maven-cache:
  frontend-node-modules:
