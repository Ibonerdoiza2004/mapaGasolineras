# Carga una configuración local ignorada por Git, si existe. Las variables del
# sistema siempre tienen prioridad y se usan en producción.
spring.config.import=optional:file:./.env.local[.properties]

# Puerto de la aplicación
server.port=${SERVER_PORT:8080}

# Orígenes permitidos para CORS (separados por comas).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4321}

# Conexión PostgreSQL / PostGIS
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA (Hibernate 7 auto-detecta PostGIS)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Se expone solo la comprobación de salud para que los contenedores y la
# integración continua puedan verificar que la aplicación y la base de datos
# están disponibles.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
