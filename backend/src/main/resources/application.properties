# Carga una configuración local ignorada por Git, si existe. Las variables del
# sistema siempre tienen prioridad y se usan en producción.
spring.config.import=optional:file:./.env.local[.properties]

# Puerto de la aplicación
server.port=${SERVER_PORT:8080}

# Conexión PostgreSQL / PostGIS
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA (Hibernate 7 auto-detecta PostGIS)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
