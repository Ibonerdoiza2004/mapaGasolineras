# Carga una configuración local ignorada por Git, si existe. Las variables del
# sistema siempre tienen prioridad y se usan en producción.
spring.config.import=optional:file:./.env.local[.properties]

# Puerto de la aplicación
server.port=${SERVER_PORT:8080}

# Orígenes permitidos para CORS (separados por comas).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4321}

# Conexión PostgreSQL / PostGIS
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA (Hibernate 7 auto-detecta PostGIS)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Se expone solo la comprobación de salud para que los contenedores y la
# integración continua puedan verificar que la aplicación y la base de datos
# están disponibles.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Configuración del cliente Geoportal/MITECO
app.geoportal.base-url=${APP_GEOPORTAL_BASE_URL:https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/}
app.geoportal.timeout-seconds=${APP_GEOPORTAL_TIMEOUT_SECONDS:30}

# Configuración del geocodificador (Nominatim por defecto)
app.geocode.base-url=${APP_GEOCODE_BASE_URL:https://nominatim.openstreetmap.org}
app.geocode.timeout-seconds=${APP_GEOCODE_TIMEOUT_SECONDS:10}
app.geocode.user-agent=${APP_GEOCODE_USER_AGENT:MapaGasolineras/0.1}
app.geocode.max-requests-per-minute=${APP_GEOCODE_MAX_REQUESTS_PER_MINUTE:30}
app.geocode.cache-max-size=${APP_GEOCODE_CACHE_MAX_SIZE:2000}
app.geocode.cache-ttl-hours=${APP_GEOCODE_CACHE_TTL_HOURS:24}

# Importación periódica de datos
app.import.initial-delay-ms=${APP_IMPORT_INITIAL_DELAY_MS:180000}
app.import.interval-ms=${APP_IMPORT_INTERVAL_MS:3600000}
